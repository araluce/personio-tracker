[package]
name = "personio-tracker-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI that auto-fills Personio attendance for pending working days"
license = "MIT"

# The installed command. The package keeps its own name, and so does the
# platform data directory, so an existing settings/session/calendar set is
# still found after installing.
[[bin]]
name = "personio-tracker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chromiumoxide = "0.9.1"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
keyring = "4.2.0"
keyring-core = "1.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
