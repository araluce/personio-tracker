<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="personio-tracker — types your hours into Personio, from a terminal. Unofficial, not affiliated with Personio SE.">
  <title>personio-tracker</title>

  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#56D4DD" stop-opacity="0"/>
      <stop offset="45%" stop-color="#56D4DD" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#7EE787" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The terminal panel brings its own ground, so the mark reads the same on
       a light or a dark README. -->
  <rect x="1" y="1" width="958" height="298" rx="18" fill="#0D1117" stroke="#21262D" stroke-width="2"/>

  <circle cx="40" cy="36" r="6.5" fill="#30363D"/>
  <circle cx="64" cy="36" r="6.5" fill="#30363D"/>
  <circle cx="88" cy="36" r="6.5" fill="#30363D"/>

  <!-- The mark is the app's own grid: one cell per day, coloured by what
       became of it. Green tracked, blue an absence, magenta a holiday, grey
       the weekend, outlined a day nothing is known about yet. -->
  <g transform="translate(56 100)">
    <rect width="26" height="26" rx="6" fill="#D2A8FF"/>
    <rect x="36" width="26" height="26" rx="6" fill="#7EE787"/>
    <rect x="72" width="26" height="26" rx="6" fill="#7EE787"/>
    <rect x="108" width="26" height="26" rx="6" fill="#3FB950"/>
    <rect x="144" width="26" height="26" rx="6" fill="#30363D"/>

    <rect y="36" width="26" height="26" rx="6" fill="#7EE787"/>
    <rect x="36" y="36" width="26" height="26" rx="6" fill="#79C0FF"/>
    <rect x="72" y="36" width="26" height="26" rx="6" fill="#79C0FF"/>
    <rect x="108" y="36" width="26" height="26" rx="6" fill="#7EE787"/>
    <rect x="144" y="36" width="26" height="26" rx="6" fill="#30363D"/>

    <rect y="72" width="26" height="26" rx="6" fill="#3FB950"/>
    <rect x="36" y="72" width="26" height="26" rx="6" fill="#7EE787"/>
    <!-- today -->
    <rect x="72" y="72" width="26" height="26" rx="6" fill="#7EE787" stroke="#E6EDF3" stroke-width="2"/>
    <rect x="108" y="72" width="26" height="26" rx="6" fill="none" stroke="#30363D" stroke-width="2"/>
    <rect x="144" y="72" width="26" height="26" rx="6" fill="none" stroke="#30363D" stroke-width="2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="268" y="132" font-size="44" font-weight="700" fill="#E6EDF3">personio-tracker</text>
    <text x="270" y="172" font-size="19" fill="#8B949E">types your hours into Personio, from a terminal</text>

    <!-- Said on the mark itself, not only in the README. -->
    <g transform="translate(270 194)">
      <rect width="118" height="28" rx="14" fill="none" stroke="#484F58" stroke-width="1.5"/>
      <text x="17" y="19" font-size="14" fill="#8B949E">unofficial</text>
      <text x="134" y="19" font-size="14" fill="#6E7681">not affiliated with Personio SE</text>
    </g>
  </g>

  <!-- The activity trail, the way it travels along the foot of the log pane
       while a run is in flight. -->
  <rect x="56" y="254" width="848" height="4" rx="2" fill="url(#trail)"/>
</svg>
